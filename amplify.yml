version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        - |
          cat <<EOF > .next/.env.production
          DATABASE_URL=$DATABASE_URL
          AUTH_SECRET=$AUTH_SECRET
          NEXT_PUBLIC_SITE_NAME=$NEXT_PUBLIC_SITE_NAME
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          PAYMENT_PROVIDER=$PAYMENT_PROVIDER
          PAGARME_API_KEY=$PAGARME_API_KEY
          NEXT_PUBLIC_PAGARME_PUBLIC_KEY=$NEXT_PUBLIC_PAGARME_PUBLIC_KEY
          PAGARME_WEBHOOK_USER=$PAGARME_WEBHOOK_USER
          PAGARME_WEBHOOK_PASSWORD=$PAGARME_WEBHOOK_PASSWORD
          NEXT_PUBLIC_MAX_INSTALLMENTS=$NEXT_PUBLIC_MAX_INSTALLMENTS
          EOF
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
